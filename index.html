<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Status Creator Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111114; --panel:#1a1a1f; --panel2:#222229; --border:#2c2c35;
    --text:#e8e8ec; --dim:#8b8b96; --accent:#4a8ded; --green:#3fae6a; --danger:#e05555;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;padding:0 0 40px;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px}

  .hello{font-size:24px;font-weight:900;letter-spacing:-.3px}
  .week{color:var(--dim);font-size:13px;margin-top:3px}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px}

  .stat-row{display:flex;gap:12px;margin-top:14px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
  .stat .n{font-size:20px;font-weight:800;line-height:1.1}
  .stat .n.good{color:var(--green)}
  .stat .l{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:5px}

  .bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}

  .sec{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:26px 0 10px}

  .hook{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:10px;transition:border-color .15s}
  .hook.done{border-color:#2f6b45;background:#16241c}
  .hook .txt{font-size:15.5px;font-weight:600;line-height:1.45}
  .hook.done .txt{color:var(--dim)}
  .hook .meta{font-size:12.5px;color:var(--dim);margin-top:9px;line-height:1.5}
  .hook .meta b{color:var(--text);font-weight:600}
  .hook .act{margin-top:13px;display:flex;align-items:center;gap:10px}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:700}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:11px 16px}
  .btn:active{transform:scale(.98)}
  .btn.mark{background:var(--accent);color:#fff;border-color:transparent;width:100%}
  .btn.undo{background:transparent;color:var(--dim);border:none;padding:6px 0;font-size:13px;text-decoration:underline}
  .btn:disabled{opacity:.55}
  .done-tag{color:var(--green);font-weight:800;font-size:14px}

  .post{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .post:last-child{border-bottom:none}
  .post .plat{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;width:74px;flex-shrink:0}
  .post a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .post .views{color:var(--dim);font-size:12px;flex-shrink:0}

  .empty{color:var(--dim);font-size:14px;line-height:1.6;text-align:center;padding:34px 18px}
  .msg{font-size:13px;color:var(--dim);text-align:center;padding:40px 18px;line-height:1.6}
  .msg.err{color:var(--danger)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .foot{color:var(--dim);font-size:11.5px;text-align:center;margin-top:30px;line-height:1.6}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="msg"><span class="spin"></span></div>
</div>

<script>
const app = document.getElementById('app');
const token = new URLSearchParams(location.search).get('t') || '';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDay(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function api(payload){
  const res = await fetch('/.netlify/functions/creator', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, ...payload })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

let state = null;

async function load(){
  if (!token) {
    app.innerHTML = '<div class="msg err">This link is missing its code. Ask the team for your link.</div>';
    return;
  }
  try {
    state = await api({ action: 'load' });
    render();
  } catch (e) {
    app.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
  }
}

function render(){
  const hooks = state.hooks || [];
  const done = hooks.filter(h => h.status === 'posted').length;
  const p = state.posting || {};

  const pct = hooks.length ? Math.round((done / hooks.length) * 100) : 0;
  const daysDone = p.days_posted_this_week || 0;
  const daysTarget = p.posting_days_per_week || 0;
  const vids = p.videos_this_week || 0;
  const vidTarget = p.weekly_video_target || 0;

  app.innerHTML =
    '<div class="hello">Hey ' + esc((state.creator.name || '').split(' ')[0]) + '</div>' +
    '<div class="week">' +
      (state.week
        ? 'Week of ' + esc(fmtDay(state.week.start)) + ' – ' + esc(fmtDay(state.week.end))
        : 'No hooks posted yet this week') +
    '</div>' +

    (hooks.length ? (
      '<div class="card">' +
        '<div style="display:flex;align-items:baseline;gap:8px">' +
          '<span style="font-size:26px;font-weight:900' + (done === hooks.length ? ';color:var(--green)' : '') + '">' + done + '</span>' +
          '<span style="color:var(--dim);font-size:15px;font-weight:700">of ' + hooks.length + ' hooks posted</span>' +
        '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '</div>'
    ) : '') +

    ((daysTarget || vidTarget) ? (
      '<div class="stat-row">' +
        (daysTarget ? '<div class="stat"><div class="n' + (daysDone >= daysTarget ? ' good' : '') + '">' +
          daysDone + '/' + daysTarget + '</div><div class="l">Days posted</div></div>' : '') +
        (vidTarget ? '<div class="stat"><div class="n' + (vids >= vidTarget ? ' good' : '') + '">' +
          vids + '/' + vidTarget + '</div><div class="l">Videos</div></div>' : '') +
      '</div>'
    ) : '') +

    '<div class="sec">Your hooks this week</div>' +
    (hooks.length ? hooks.map(hookCard).join('') :
      '<div class="empty">Nothing here yet.<br>Your hooks for the week will show up here once the team sends them out.</div>') +

    ((state.recent || []).length ? (
      '<div class="sec">Your recent posts</div>' +
      '<div class="card" style="padding:6px 15px">' +
        state.recent.map(r =>
          '<div class="post">' +
            '<span class="plat">' + esc((r.platform || '').toUpperCase()) + '</span>' +
            '<a href="' + esc(r.video_url) + '" target="_blank" rel="noopener">' + esc(fmtDay(r.day)) + '</a>' +
            '<span class="views">' + (r.views != null ? Number(r.views).toLocaleString() : '') + '</span>' +
          '</div>').join('') +
      '</div>'
    ) : '') +

    '<div class="foot">This page is just for you. Posts are detected automatically &mdash; you don&rsquo;t need to send links.</div>';

  app.querySelectorAll('[data-hook]').forEach(btn => {
    btn.onclick = () => setStatus(btn.dataset.hook, btn.dataset.to);
  });
}

function hookCard(h){
  const done = h.status === 'posted';
  const meta = [];
  if (h.footage_idea) meta.push('<b>Footage:</b> ' + esc(h.footage_idea));
  if (h.notes) meta.push(esc(h.notes));

  return '<div class="hook' + (done ? ' done' : '') + '">' +
    '<div class="txt">' + esc(h.hook_text) + '</div>' +
    (meta.length ? '<div class="meta">' + meta.join('<br>') + '</div>' : '') +
    '<div class="act">' +
      (done
        ? '<span class="done-tag">Posted &#10003;</span>' +
          '<span style="flex:1"></span>' +
          '<button class="btn undo" data-hook="' + esc(h.id) + '" data-to="assigned">Undo</button>'
        : '<button class="btn mark" data-hook="' + esc(h.id) + '" data-to="posted">Mark as posted</button>') +
    '</div>' +
  '</div>';
}

async function setStatus(hookId, to){
  const hook = (state.hooks || []).find(h => h.id === hookId);
  if (!hook) return;

  // Update immediately so a tap feels instant, and put it back if the save
  // fails. On a phone with patchy signal this matters.
  const before = hook.status;
  hook.status = to;
  render();

  try {
    await api({ action: 'setStatus', hook_id: hookId, status: to });
  } catch (e) {
    hook.status = before;
    render();
    alert(e.message);
  }
}

load();
</script>
</body>
</html>
